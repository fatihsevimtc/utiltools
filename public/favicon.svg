<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#6c63ff"/>

  <!-- 2×2 grid icon, same as the Logo component, centred on the tile -->
  <!-- top-left: white low opacity -->
  <rect x="10" y="10" width="18" height="18" rx="4" fill="#ffffff" opacity="0.4"/>
  <!-- top-right: white full -->
  <rect x="36" y="10" width="18" height="18" rx="4" fill="#ffffff"/>
  <!-- bottom-left: white medium -->
  <rect x="10" y="36" width="18" height="18" rx="4" fill="#ffffff" opacity="0.7"/>
  <!-- bottom-right: white low opacity -->
  <rect x="36" y="36" width="18" height="18" rx="4" fill="#ffffff" opacity="0.25"/>
</svg>
